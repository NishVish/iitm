
<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Qwen Chatbot</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }


        .chat {

            width: 750px;

            max-width: 95%;

            margin: 40px auto;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,.12);
        }


        .header {

            background: #202020;

            color: white;

            padding: 20px;

            font-size: 22px;

            font-weight: bold;
        }


        .model {

            font-size: 13px;

            color: #aaa;

            margin-top: 5px;

            font-weight: normal;
        }


        #messages {

            height: 500px;

            overflow-y: auto;

            padding: 20px;
        }


        .message {

            padding: 12px 16px;

            margin-bottom: 15px;

            border-radius: 10px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        .user {

            background: #dbeafe;

            margin-left: 100px;
        }


        .assistant {

            background: #eeeeee;

            margin-right: 100px;
        }


        .input-area {

            display: flex;

            padding: 15px;

            border-top: 1px solid #ddd;
        }


        #input {

            flex: 1;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            outline: none;
        }


        #input:focus {

            border-color: #555;
        }


        #send {

            margin-left: 10px;

            padding: 13px 24px;

            border: none;

            border-radius: 7px;

            background: #202020;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        #send:hover {

            background: #444;
        }


        #send:disabled {

            background: #999;

            cursor: not-allowed;
        }

    </style>

</head>


<body>


<div class="chat">


    <div class="header">

        Qwen Chatbot

        <div class="model">

            qwen2.5:7b • Ollama • Local

        </div>

    </div>


    <div id="messages"></div>


    <div class="input-area">

        <input
            id="input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off"
        >

        <button id="send">
            Send
        </button>

    </div>


</div>


<script>


const input =
    document.getElementById("input");


const send =
    document.getElementById("send");


const messages =
    document.getElementById("messages");



function addMessage(
    name,
    text,
    className
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + className;


    div.textContent =
        name + ": " + text;


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;


    return div;
}



async function sendMessage() {


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    addMessage(
        "You",
        text,
        "user"
    );


    input.value = "";


    input.disabled = true;

    send.disabled = true;


    const thinking =
        addMessage(
            "Qwen",
            "Thinking...",
            "assistant"
        );


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })

                }
            );


        const data =
            await response.json();


        thinking.remove();


        addMessage(
            "Qwen",
            data.response,
            "assistant"
        );


    } catch (error) {


        thinking.remove();


        addMessage(
            "Qwen",
            "Connection error: " +
            error.message,
            "assistant"
        );

    }


    input.disabled = false;

    send.disabled = false;

    input.focus();

}



send.addEventListener(
    "click",
    sendMessage
);



input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


input.focus();

</script>


</body>

</html>
