
<!DOCTYPE html>

<html>

<head>

    <title>Qwen 5.7B Chatbot</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f4f6;
        }


        .container {

            width: 700px;

            max-width: 95%;

            margin: 40px auto;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.12);
        }


        .header {

            background: #222;

            color: white;

            padding: 18px;

            font-size: 20px;

            font-weight: bold;
        }


        .subtitle {

            font-size: 13px;

            font-weight: normal;

            color: #bbb;

            margin-top: 5px;
        }


        #messages {

            height: 500px;

            overflow-y: auto;

            padding: 20px;
        }


        .message {

            padding: 12px 15px;

            margin-bottom: 12px;

            border-radius: 10px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;
        }


        .user {

            background: #dbeafe;

            margin-left: 80px;
        }


        .bot {

            background: #eeeeee;

            margin-right: 80px;
        }


        .input-area {

            display: flex;

            padding: 15px;

            border-top:
                1px solid #ddd;
        }


        #input {

            flex: 1;

            padding: 12px;

            font-size: 16px;

            border:
                1px solid #ccc;

            border-radius: 6px;

            outline: none;
        }


        #input:focus {

            border-color: #555;
        }


        button {

            margin-left: 10px;

            padding: 12px 22px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {

            background: #444;
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        Qwen 5.7B Chatbot

        <div class="subtitle">

            Local AI running through Ollama

        </div>

    </div>


    <div id="messages"></div>


    <div class="input-area">

        <input

            id="input"

            type="text"

            placeholder="Ask Qwen something..."

            autocomplete="off"

        >


        <button

            id="sendButton"

            onclick="sendMessage()"

        >

            Send

        </button>

    </div>


</div>


<script>


const input =
    document.getElementById("input");


const messages =
    document.getElementById("messages");


const sendButton =
    document.getElementById("sendButton");



input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);



function addMessage(
    sender,
    text,
    type
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.textContent =
        sender + ": " + text;


    messages.appendChild(div);


    messages.scrollTop =
        messages.scrollHeight;


    return div;

}



async function sendMessage() {


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        "You",
        message,
        "user"
    );


    input.value = "";


    input.disabled = true;

    sendButton.disabled = true;


    const thinking =
        addMessage(
            "Qwen",
            "Thinking...",
            "bot"
        );


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })

                }
            );


        const data =
            await response.json();


        thinking.remove();


        addMessage(
            "Qwen",
            data.response,
            "bot"
        );


    }


    catch (error) {


        thinking.remove();


        addMessage(
            "Qwen",
            "Could not connect to Flask/Ollama.",
            "bot"
        );


        console.error(error);

    }


    finally {


        input.disabled = false;

        sendButton.disabled = false;

        input.focus();

    }

}


input.focus();


</script>


</body>

</html>
